<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page not found</title>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; text-align: center;
         font-family: Georgia, serif; color: #fff;
         background: linear-gradient(135deg, #1e3c72, #2a5298, #7e57c2); }
  h1 { font-size: 9rem; margin: 0; letter-spacing: .5rem;
       text-shadow: 0 6px 20px rgba(0,0,0,.4); animation: float 3s ease-in-out infinite; }
  p { font-size: 1.6rem; font-style: italic; margin: .5rem 0 2rem; }
  a { color: #1e3c72; background: #fff; padding: .7rem 1.6rem; border-radius: 2rem;
      text-decoration: none; font-family: Arial, sans-serif; font-weight: bold; }
  a:hover { background: #ffd54f; }
  @keyframes float { 50% { transform: translateY(-15px); } }
</style>
</head>
<body>
  <h1>404</h1>
  <p>Ceci n'est pas une page</p>
  <a href="/">Take me home</a>
</body>
</html>
